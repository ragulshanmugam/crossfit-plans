  <script>

    {"file":"2026-08-26-Wednesday.html","date":"2026-08-26","weekday":"Wednesday","title":"CrossFit Session — Wednesday, Aug 26, 2026","focus":"Front squat strength (quads, trunk, front rack) paired with a 5-round machine + shoulder interval MetCon. Deliberately low on hinge volume and pulling volume — both were hammered Mon–Tue."},

    {"file":"2026-08-20-Thursday.html","date":"2026-08-20","weekday":"Thursday","title":"CrossFit — Thursday, August 20, 2026 · Vertical Pull &amp; Press + Bike/Snatch Engine","focus":"the upper body gets the heavy work today so yesterday's back squat and Monday's deadlift can recover."},
    {"file":"2026-08-19-Wednesday.html","date":"2026-08-19","weekday":"Wednesday","title":"CrossFit — Wednesday, August 19, 2026 · Back Squat + Row/Swing/T2B Engine","focus":"back squat — the one heavy pattern that hasn't appeared in nine days — then a low-press, grip-and-lungs engine on the rower."},

    {"file":"2026-08-11-Tuesday.html","date":"2026-08-11","weekday":"Tuesday","title":"CrossFit — Tuesday, August 11, 2026","focus":"horizontal press &amp; horizontal pull strength, then a low-impact row / hinge / burpee engine. Chest, upper back, posterior chain, core, lungs."},
    {"file":"2026-08-10-Monday.html","date":"2026-08-10","weekday":"Monday","title":"CrossFit — Monday, August 10, 2026","focus":"front squat strength with a slow eccentric, then a running / strict-pulling / DB-overhead engine."},

    {"file":"2026-08-03-Monday.html","date":"2026-08-03","weekday":"Monday","title":"CrossFit — Monday, August 3, 2026","focus":"upper-body pull &amp; horizontal press strength + a mixed pull/push engine. Back, chest, shoulders, grip, lungs."},
    {"file":"2026-07-31-Friday.html","date":"2026-07-31","weekday":"Friday","title":"CrossFit — Friday, July 31, 2026","focus":"Front-squat strength + rowing/kettlebell engine. Legs, core, grip, lungs."},
    {"file":"2026-07-31-Friday-Cardio-HIIT.html","date":"","weekday":"","title":"Cardio HIIT — Friday, July 31, 2026","focus":"pure engine — machine intervals + light DB/bodyweight circuit. Low joint load, high heart rate."},
    {"file":"2026-06-25-Thursday.html","date":"2026-06-25","weekday":"Thursday","title":"CrossFit — Thursday, June 25, 2026","focus":"posterior-chain hinge strength (Romanian deadlift) + a non-pressing leg &amp; engine MetCon. Chest, shoulders &amp; triceps recover after Wednesday's bench day."},
    {"file":"2026-06-24-Wednesday.html","date":"2026-06-24","weekday":"Wednesday","title":"CrossFit — Wednesday, June 24, 2026","focus":"horizontal push strength (bench press) + a push-biased mixed engine. Legs &amp; low back stay fresh after Monday's squats and Tuesday's row/pull."},
    {"file":"2026-06-23-Tuesday.html","date":"2026-06-23","weekday":"Tuesday","title":"CrossFit — Tuesday, June 23, 2026 · Push/Pull & Rowing Engine","focus":""},
    {"file":"2026-06-22-Monday.html","date":"2026-06-22","weekday":"Monday","title":"CrossFit — Monday, June 22, 2026 · Back Squat & Mixed Engine","focus":"knee-dominant squat strength (low back stays fresh after last week's deadlifts) plus a lung-opening mixed-modal triplet."},
    {"file":"2026-06-19-Friday.html","date":"2026-06-19","weekday":"Friday","title":"CrossFit · Friday June 19, 2026","focus":"posterior-chain strength (deadlift) plus a running engine with explosive legs and pulling. Closing the week with the patterns we've under-loaded — hinge, jumps, and an engine that hasn't been hammered. No heavy squatting or pressing today."},
    {"file":"2026-06-18-Thursday.html","date":"2026-06-18","weekday":"Thursday","title":"CrossFit — Thursday, June 18, 2026 · Pull & Glute Engine","focus":"Horizontal-pull + posterior-chain (glute/hamstring) strength — the two patterns this week skipped — paired with a low-grip, spine-sparing mixed-modal engine. Closes the week's map: deadlift Mon, bench Tue, single-leg squat Wed → rows + hip thrust today."},
    {"file":"2026-06-17-Wednesday.html","date":"2026-06-17","weekday":"Wednesday","title":"CrossFit — Wednesday, June 17, 2026","focus":"Single-leg strength &amp; mixed-modal engine. A deliberate break from heavy barbell spinal loading (deadlifts Mon, bench/push-press Tue) — today we build unilateral leg strength and aerobic capacity."},
    {"file":"2026-06-16-Tuesday.html","date":"2026-06-16","weekday":"Tuesday","title":"CrossFit — Tuesday, June 16, 2026 · Bench Press & Upstairs Engine","focus":"Today's focus: Upper-body horizontal push strength (Bench Press) paired with an entirely upper-body + engine MetCon — row, pull-ups and DB push press. Yesterday was a heavy deadlift, so today keeps the legs and low back light and trains upstairs."},
    {"file":"2026-06-15-Monday.html","date":"2026-06-15","weekday":"Monday","title":"CrossFit — Monday, June 15, 2026 · Deadlift & Engine","focus":"Today's focus: Posterior-chain strength (Deadlift) paired with a run-based engine triplet that spares the spine and legs. Last week covered bench, rows, back squat, pull-ups and DB press — the hinge was the one big pattern missing, so we anchor with it on a fresh Monday."},

    {"file":"2026-06-09-Tuesday.html","date":"2026-06-09","weekday":"Tuesday","title":"CrossFit — Tuesday, June 9, 2026","focus":"Upper-Body Pull (back &amp; lats) strength + leg-sparing engine conditioning"},
    {"file":"2026-06-08-Monday.html","date":"2026-06-08","weekday":"Monday","title":"CrossFit · Monday, June 8, 2026","focus":"Today's focus: Horizontal pressing strength (bench) paired with a legs-pull-engine engine builder. A fresh-week reset that hits the patterns last week's hinge/squat days didn't."},

    {"file":"2026-06-01-Monday.html","date":"2026-06-01","weekday":"Monday","title":"Monday · June 1, 2026 — Push & Pulse","focus":"Push + Engine"},
    {"file":"2026-05-29-Friday.html","date":"2026-05-29","weekday":"Friday","title":"CrossFit — Friday, May 29, 2026","focus":""},

  ];
  (function () {
    var byDate = {};
    PLANS.forEach(function (p) { if (p.date) { byDate[p.date] = p; } });
    var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    var cur;
    if (PLANS.length && PLANS[0].date) { var s = PLANS[0].date.split("-"); cur = new Date(+s[0], +s[1] - 1, 1); }
    else { var n = new Date(); cur = new Date(n.getFullYear(), n.getMonth(), 1); }

    function pad(n) { return String(n).padStart(2, "0"); }
    function ymd(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

    function fmt(p) {
      if (p.date) { var s = p.date.split("-"); var dt = new Date(+s[0], +s[1] - 1, +s[2]); return (p.weekday || DOW[dt.getDay()]) + ", " + MONTHS[dt.getMonth()] + " " + dt.getDate() + ", " + dt.getFullYear(); }
      return p.file.replace(/\.html$/, "");
    }

    function renderCal() {
      var y = cur.getFullYear(), m = cur.getMonth();
      document.getElementById("monthLabel").textContent = MONTHS[m] + " " + y;
      var first = new Date(y, m, 1).getDay();
      var days = new Date(y, m + 1, 0).getDate();
      var today = new Date(), todayStr = ymd(today.getFullYear(), today.getMonth(), today.getDate());
      var grid = document.getElementById("grid");
      grid.replaceChildren();
      DOW.forEach(function (d) { grid.appendChild(el("div", "text-center text-xs font-semibold text-slate-400 py-1", d)); });
      for (var i = 0; i < first; i++) { grid.appendChild(el("div")); }
      for (var d = 1; d <= days; d++) {
        var key = ymd(y, m, d), p = byDate[key];
        var ring = key === todayStr ? " ring-2 ring-rose-400" : "";
        if (p) {
          var a = el("a", "flex items-center justify-center aspect-square rounded-xl bg-rose-600 text-white font-bold hover:bg-rose-700" + ring, String(d));
          a.href = p.file; a.title = p.focus || p.title || "";
          grid.appendChild(a);
        } else {
          grid.appendChild(el("div", "flex items-center justify-center aspect-square rounded-xl text-slate-400" + ring, String(d)));
        }
      }
    }

    function renderCards(filter) {
      filter = (filter || "").toLowerCase();
      var cont = document.getElementById("cards");
      cont.replaceChildren();
      var shown = 0;
      PLANS.forEach(function (p) {
        var sub = p.focus || p.title || "";
        if (filter && (p.file + " " + fmt(p) + " " + sub).toLowerCase().indexOf(filter) < 0) return;
        var a = el("a", "block rounded-2xl border border-slate-200 bg-white px-5 py-4 hover:border-rose-300 hover:shadow-sm");
        a.href = p.file;
        a.appendChild(el("div", "font-bold text-slate-900", fmt(p)));
        if (sub) a.appendChild(el("div", "mt-1 text-sm text-slate-600", sub));
        cont.appendChild(a);
        shown++;
      });
      if (!shown) cont.appendChild(el("p", "text-slate-500 px-1", "No matches."));
    }

    function setActive(id, on) {
      document.getElementById(id).className = "px-4 py-2 rounded-xl text-sm font-semibold " + (on ? "bg-slate-900 text-white" : "bg-white text-slate-700 border border-slate-300");
    }
    function show(view) {
      var cal = view === "cal";
      document.getElementById("calView").classList.toggle("hidden", !cal);
      document.getElementById("listView").classList.toggle("hidden", cal);
      setActive("tabCal", cal); setActive("tabList", !cal);
    }

    document.getElementById("prevBtn").onclick = function () { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); renderCal(); };
    document.getElementById("nextBtn").onclick = function () { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); renderCal(); };
    document.getElementById("tabCal").onclick = function () { show("cal"); };
    document.getElementById("tabList").onclick = function () { show("list"); };
    document.getElementById("search").addEventListener("input", function (e) { renderCards(e.target.value); });

    renderCal(); renderCards(""); show("cal");
  })();
  </script>
</body>
</html>
